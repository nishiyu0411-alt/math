<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#7482bd"><title>诗雨 · 综合刷题站</title><link rel="stylesheet" href="./style.css"><script src="./questions.js" defer></script><script src="./app.js" defer></script></head>
<body><header class="top"><div><a class="logo" href="./">✦ 诗雨的刷题空间</a><div class="subtitle">词汇 · 逻辑 · 数学｜错题回练 · 云端进度</div></div><div class="topright"><span id="clock">◷ 00:00:00</span><button id="timerBtn" class="soft">暂停计时</button><button id="togglePanel" class="soft">☰ 题型与进度</button></div></header>
<main class="layout"><aside class="panel" id="panel"><div class="card"><h2>学习概览</h2><div class="stats"><div><b id="done">0</b><small>已完成</small></div><div><b id="accuracy">—</b><small>正确率</small></div><div><b id="wrongs">0</b><small>错题</small></div><div><b id="stars">0</b><small>已收藏</small></div></div></div>
<div class="card"><h2>选择练习</h2><label>题型大类</label><select id="major"><option value="ALL">全部大类</option></select><label>具体小类</label><select id="minor"><option value="ALL">全部小类</option></select><label>练习模式</label><select id="mode"><option value="all">全部题目</option><option value="new">未做题目</option><option value="wrong">错题回练</option><option value="favorite">我的收藏</option><option value="flagged">待核验题目</option></select><div class="buttonrow"><button id="shuffle" class="soft">⇄ 打乱顺序</button><button id="resetOrder" class="soft">恢复顺序</button></div><div class="progress"><div id="progressbar"></div></div><div id="progresslabel" class="muted">0 / 0</div></div>
<div class="card"><h2>题目导航</h2><div id="palette" class="palette"></div></div>
<div class="card"><h2>☁ 跨设备同步</h2><p class="muted">电脑、iPad、手机填写同一个同步码。同步码请设置为不易猜测的长字符串，并妥善保管。</p><input id="syncCode" placeholder="同步码（至少12位）" autocomplete="off" /><div class="buttonrow"><button id="sync" class="mainbtn">读取并同步</button><button id="generate" class="soft">生成同步码</button></div><div id="syncStatus" class="muted">本机自动保存；同步前先输入同步码</div><div class="buttonrow"><button id="export" class="soft">导出进度</button><button id="import" class="soft">导入进度</button></div><input type="file" id="importFile" accept="application/json" hidden></div></aside>
<section class="main"><div class="hero"><div><span class="eyebrow">STUDY SPACE · 2026</span><h1>把每一道会做的题，都变成底气。</h1><p>分类练习，及时反馈。错题可反复练，掌握情况自动保存。</p></div><div class="heroicons">✿ ✦</div></div><div class="question card"><div class="questiontop"><div id="crumb" class="crumb"></div><span id="counter" class="muted"></span></div><div id="questionContent"></div><div class="nav"><button id="prev" class="soft">← 上一题</button><button id="favorite" class="soft">☆ 收藏</button><button id="flag" class="soft">⚑ 反馈题目</button><button id="next" class="mainbtn">下一题 →</button></div><p class="hint">快捷键：<kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> <kbd>4</kbd> 直接提交 A B C D　·　<kbd>空格</kbd> 收藏　·　<kbd>←</kbd> <kbd>→</kbd> 切题</p></div></section></main><div id="toast" role="status"></div></body></html>
