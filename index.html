<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#5f3bbf" />
    <meta name="description" content="308道数学专项练习，支持逐题解析、错题回练、计时、保留进度和跨设备同步。" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://awvmsvxzsphxfzluunwh.supabase.co; img-src 'self' data:; style-src 'self'; script-src 'self'; manifest-src 'self';" />
    <title>紫藤数学刷题站</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="./" aria-label="紫藤数学刷题站首页">
          <span class="brand-mark" aria-hidden="true">∑</span>
          <span>
            <strong>紫藤数学刷题站</strong>
            <small>专项练习｜自动保存｜错题回练｜同步进度</small>
          </span>
        </a>

        <div class="header-actions">
          <div class="timer" aria-label="答题计时器">
            <span aria-hidden="true">◷</span>
            <strong id="timer">00:00:00</strong>
            <button id="timerToggle" type="button">暂停</button>
            <button id="timerReset" type="button">重置</button>
          </div>
          <button id="mobilePanelToggle" class="mobile-panel-toggle" type="button" aria-controls="sidebar" aria-expanded="false">题目与同步</button>
        </div>
      </div>
    </header>

    <main class="workspace">
      <aside id="sidebar" class="sidebar" aria-label="练习设置与题目导航">
        <div class="sidebar-head">
          <strong>练习面板</strong>
          <button id="closeSidebar" type="button" aria-label="关闭练习面板">×</button>
        </div>

        <section class="stats-grid" aria-label="练习统计">
          <div class="stat"><strong id="statDone">0</strong><span>已作答</span></div>
          <div class="stat"><strong id="statAccuracy">—</strong><span>正确率</span></div>
          <div class="stat"><strong id="statWrong">0</strong><span>错题</span></div>
          <div class="stat"><strong id="statFavorite">0</strong><span>收藏</span></div>
        </section>

        <section class="control-section">
          <label for="modeSelect">练习模式</label>
          <select id="modeSelect">
            <option value="all">全部题目</option>
            <option value="todo">待完成</option>
            <option value="wrong">错题回练</option>
            <option value="favorite">收藏题目</option>
          </select>

          <label for="topicSelect">题型筛选</label>
          <select id="topicSelect"><option value="ALL">全部题型</option></select>

          <div class="order-actions">
            <button id="shuffleButton" type="button">随机顺序</button>
            <button id="resetOrderButton" type="button">顺序刷题</button>
          </div>
        </section>

        <section class="progress-section" aria-label="当前练习进度">
          <div class="progress-track"><span id="progressBar"></span></div>
          <div class="progress-line"><span id="progressText">1 / 308</span><span id="saveTime">尚未作答</span></div>
        </section>

        <section class="sync-section" aria-labelledby="syncTitle">
          <div class="section-title"><strong id="syncTitle">手机与电脑同步</strong><span id="syncStatus">仅本机保存</span></div>
          <div class="sync-row">
            <input id="syncCode" type="text" maxlength="64" placeholder="输入至少8位同步码" autocomplete="off" aria-label="同步码" />
            <button id="syncButton" type="button">同步</button>
          </div>
          <div class="sync-tools">
            <button id="generateSyncCode" type="button">生成同步码</button>
            <span>两台设备输入同一个码即可恢复进度</span>
          </div>
        </section>

        <section class="navigator-section" aria-labelledby="navigatorTitle">
          <div class="section-title"><strong id="navigatorTitle">题号导航</strong><span>点击题号跳转</span></div>
          <div id="questionGrid" class="question-grid"></div>
          <div class="legend"><span><i class="done"></i>已完成</span><span><i class="wrong"></i>错题</span><span><i class="current"></i>当前</span></div>
        </section>

        <section class="data-section" aria-labelledby="dataTitle">
          <div class="section-title"><strong id="dataTitle">数据管理</strong><span>同步码会保留</span></div>
          <button id="clearAllButton" class="danger-button" type="button">清除所有刷题数据</button>
          <p>将清空答题记录、错题、收藏、当前位置和计时，并同步到其他设备。</p>
        </section>
      </aside>

      <div id="sidebarBackdrop" class="sidebar-backdrop" aria-hidden="true"></div>

      <section class="quiz-column" aria-live="polite">
        <article id="questionCard" class="question-card">
          <div class="question-top">
            <div class="badges"><span id="topicBadge" class="badge">数学专项</span></div>
            <span id="questionNumber" class="question-number">题库第 1 题 · 当前 1/308</span>
          </div>

          <h1 id="questionText" class="question-text"></h1>
          <div id="options" class="options" role="radiogroup" aria-label="答案选项"></div>

          <section id="resultPanel" class="result-panel is-hidden" aria-live="polite">
            <div id="resultSummary" class="result-summary"></div>
            <div class="analysis">
              <strong>答案解析</strong>
              <p id="analysisText"></p>
            </div>
          </section>

          <div class="question-actions">
            <button id="prevButton" class="secondary-button" type="button">← 上一题</button>
            <button id="favoriteButton" class="secondary-button" type="button">☆ 收藏</button>
            <button id="retryButton" class="secondary-button" type="button">跳过</button>
            <span class="action-spacer"></span>
            <button id="submitButton" class="submit-button" type="button" disabled>提交答案</button>
            <button id="nextButton" class="primary-button" type="button">下一题 →</button>
          </div>

          <div class="keyboard-hint">快捷键：<kbd>1-4</kbd> 选 A-D　<kbd>Enter</kbd> 提交　<kbd>←</kbd><kbd>→</kbd> 切题　<kbd>F</kbd> 收藏</div>
        </article>

        <section id="emptyState" class="empty-state is-hidden">
          <strong>这个筛选条件下暂时没有题目</strong>
          <p>可以切换练习模式或题型筛选继续练习。</p>
          <button id="showAllButton" type="button">查看全部题目</button>
        </section>
      </section>
    </main>

    <nav class="mobile-nav" aria-label="移动端答题导航">
      <button id="mobilePrev" type="button">←<span>上一题</span></button>
      <button id="mobilePanel" type="button">▦<span>题目</span></button>
      <button id="mobileNext" type="button">→<span>下一题</span></button>
    </nav>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="./questions.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
